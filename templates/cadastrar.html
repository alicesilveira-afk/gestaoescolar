{% extends 'base.html' %}

{% block title %}Cadastro - Gestão Escolar{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #eef2f6; font-family: 'Inter', sans-serif;">

    <div style="width: 100%; max-width: 400px; background: #ffffff; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">

        <h2 style="margin: 0; text-align: center; color: #1e293b;">📝 Novo Cadastro</h2>
        <p style="margin-top: 8px; margin-bottom: 25px; text-align: center; color: #64748b; font-size: 13px;">
            Preencha os dados abaixo para criar sua conta
        </p>

        <form action="{{ url_for('cadastrar') }}" method="POST">

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 6px;">USUÁRIO</label>
                <input type="text" name="usuario" required placeholder="Escolha um nome de usuário" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; font-size: 14px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 6px;">SENHA DE ACESSO</label>
                <input type="password" name="senha" required placeholder="Digite uma senha forte" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; font-size: 14px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 6px;">TIPO DE CONTA</label>
                <select name="perfil" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; font-size: 14px; box-sizing: border-box;">
                    <option value="Aluno">Aluno</option>
                    <option value="Professor">Professor</option>
                </select>
            </div>

            <button type="submit" style="width: 100%; padding: 14px; background-color: #1e40af; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer;">
                Finalizar Cadastro
            </button>

        </form>

        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #f1f5f9; text-align: center; font-size: 14px; color: #64748b;">
            Já tem uma conta?
            <a href="{{ url_for('index') }}" style="color: #2563eb; font-weight: 600; text-decoration: none;">
                Voltar ao Login
            </a>
        </div>

    </div>

</div>
{% endblock %}
