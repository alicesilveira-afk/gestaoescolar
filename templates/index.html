<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

    <div class="container">

        <h1>Cadastro de Alunos</h1>

        <form action="{{ url_for('cadastrar') }}" method="post">

            <div class="grupo-form">
                <label for="nome">Nome Completo</label>
                <input type="text" name="nome" id="nome" placeholder="Digite o nome do aluno" required>
            </div>

            <div class="grupo-form">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Digite o e-mail" required>
            </div>

            <div class="grupo-form">
                <label for="matricula">Matrícula</label>
                <input type="text" name="matricula" id="matricula" placeholder="Digite a matrícula" required>
            </div>

            <div class="grupo-form">
                <label for="senha">Senha de Acesso</label>
                <input type="password" name="senha" id="senha" placeholder="Crie uma senha de acesso" required>
            </div>

            <div class="grupo-form">
                <label for="curso">Curso</label>
                <select name="curso" id="curso" required>
                    <option value="" disabled selected>Selecione o curso...</option>
                    <option value="Informática">Informática</option>
                    <option value="Meio Ambiente">Meio Ambiente</option>
                    <option value="Edificações">Edificações</option>
                </select>
            </div>

            <div class="grupo-form">
                <label for="data">Data de Nascimento</label>
                <input type="date" name="data" id="data" required>
            </div>

            <button type="submit">Cadastrar</button>

        </form>

        <div class="link-login-box">
            <span>Já possui uma conta?</span>
            <a href="{{ url_for('login') }}">Faça Login aqui</a>
        </div>

    </div>

</body>
</html>
