<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Estilos adicionais para organizar o setor de notas lado a lado */
        .row-notas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .row-notas input {
            text-align: center;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Cadastro de Alunos</h1>

        <form action="/cadastrar" method="post">

            <div class="grupo-form">
                <label for="nome">Nome Completo</label>
                <input type="text" name="nome" id="nome" placeholder="Digite o nome do aluno" required>
            </div>

            <div class="grupo-form">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Digite o e-mail" required>
            </div>

            <div class="grupo-form">
                <label for="matricula">Matrícula</label>
                <input type="text" name="matricula" id="matricula" placeholder="Digite a matrícula" required>
            </div>

            <div class="grupo-form">
                <label for="curso">Curso</label>
                <select name="curso" id="curso" required>
                    <option value="" disabled selected>Selecione o curso...</option>
                    <option value="Informática">Informática</option>
                    <option value="Meio Ambiente">Meio Ambiente</option>
                    <option value="Edificações">Edificações</option>
                </select>
            </div>

            <div class="grupo-form">
                <label for="data">Data de Nascimento</label>
                <input type="date" name="data" id="data" required>
            </div>

            <div class="grupo-form">
                <label>Notas dos Bimestres (0.0 a 10.0)</label>
                <div class="row-notas">
                    <div>
                        <input type="number" name="b1" step="0.1" min="0" max="10" placeholder="B1" required>
                    </div>
                    <div>
                        <input type="number" name="b2" step="0.1" min="0" max="10" placeholder="B2" required>
                    </div>
                    <div>
                        <input type="number" name="b3" step="0.1" min="0" max="10" placeholder="B3" required>
                    </div>
                    <div>
                        <input type="number" name="b4" step="0.1" min="0" max="10" placeholder="B4" required>
                    </div>
                </div>
            </div>

            <button type="submit">Cadastrar</button>

        </form>

    </div>

</body>
</html>
